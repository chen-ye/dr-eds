<html>
<head>
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="manifest" href="manifest.json" />
    <link href="css/style.css" rel='stylesheet' type='text/css' />
    <link href="css/opensans.css" rel='stylesheet' type='text/css' />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/functions.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui" />
</head>
<body>

<div class="info" style="display: none;">
    <div class="content">
	<div class="left" type="volts"><span class="left_rd">RD[<span class="left_ver"></span>]:</span> <span class="left_val"></span></div>
	<div class="right"><span class="right_shifter">Shifter[<span class="right_ver"></span>]:</span> <span class="right_val"></span></div>
    </div>
</div>

<div class="scan">
    <div class="button edsscan">Scan for EDS OX</div>
</div>

<div class="live" style="display: none;">
    <div class="cgear">
	<div class="gear"></div>
	<div class="gears"></div>
    </div>

    <div class="action_buttons">
	<div class="button down">Down</div>
	<div class="button up">Up</div>
    </div>
</div>

<div class="settings" style="display: none;">
    <div class="action_buttons">
	<div class="button down">Down</div>
	<div class="button gear"></div>
	<div class="button gears">
	    <select>
		<option value="3">3</option>
		<option value="4">4</option>
		<option value="5">5</option>
		<option value="6">6</option>
		<option value="7">7</option>
		<option value="8">8</option>
		<option value="9">9</option>
		<option value="10">10</option>
		<option value="11">11</option>
		<option value="12">12</option>
		<option value="13">13</option>
		<option value="14">14</option>
	    </select>
	</div>
	<div class="button up">Up</div>
    </div>

    <div class="micro" style="display: none;">
	<div class="button up">Up</div>
	<div class="button down">Down</div>
    </div>

    <div class="gear_values">
	<div class="vcontent">
	    <div class="content"></div>
	    <div class="buttons">
		<div class="fake"></div>
		<div class="button set_all">Set all</div>
		<div class="button save">Save as</div>
	    </div>
	</div>
	<div class="presets"></div>
	<div class="button import">Import</div>
	<div class="button export">Export</div>
    </div>

    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="vbutton top">Up</div>
		<div class="vbutton bottom">Down</div>
	    </div>
	</div>
    </div>
</div>

<textarea class="debug" readonly></textarea>
<div class="menus">
    <div class="bmenus" style="display: none;">
	<div class="button button_power icon-power" style="display: none;"></div>
	<div class="button button_debug icon-logs selected"></div>
	<div class="button button_page icon-wrench" style="display: none;"></div>
    </div>
    <div class="button button_menu icon-gear"></div>
</div>

<div class="error" style="display: none;"></div>
<div class="qalert" style="display: none;"></div>

<div class="dim" style="display: none;"></div>

<form id="uploadform" style="display: none;">
    <input id="gearsfile" name="files[]" type="file" />
</form>

</body>
</html>
