<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="manifest" href="manifest.json" />
    <link href="css/style.css?22" rel='stylesheet' type='text/css' />
    <link href="css/opensans.css" rel='stylesheet' type='text/css' />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/functions.js?22"></script>
    <script src="lang/en.js?22"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui" />
</head>
<body>

<div class="info">
    <div class="content" style="display: none;">
	<div class="left" type="volts"><span class="left_rd"><span lang="L_RD"></span>[<span class="left_ver"></span>]:</span> <span class="left_val"></span></div>
	<div class="right"><span class="right_shifter"><span lang="L_SHIFTER"></span>[<span class="right_ver"></span>]:</span> <span class="right_val"></span></div>
    </div>
    <div class="txcontent" style="display: none;">
	<div class="left" type="volts">
	    <span class="left_rd"><span lang="L_RD"></span>[<span class="left_rver"></span>]:</span> <span class="left_rval"></span>&nbsp;
	    <span class="left_rd"><span lang="L_FD"></span>[<span class="left_fver"></span>]:</span> <span class="left_fval"></span>
	</div>
	<div class="right">
	    <span class="right_shifter"><span lang="L_SHIFTER_LEFT"></span>[<span class="right_lver"></span>]:</span> <span class="right_lval"></span>
	    <span class="right_shifter"><span lang="L_SHIFTER_RIGHT"></span>[<span class="right_rver"></span>]:</span> <span class="right_rval"></span>
	</div>
    </div>
    <div class="gxcontent" style="display: none;">
	<div class="left" type="volts">
	    <span class="left_rd"><span lang="L_RD"></span>[<span class="left_rver"></span>]:</span> <span class="left_rval"></span>
	</div>
	<div class="right">
	    <span class="right_shifter"><span lang="L_SHIFTER_LEFT"></span>[<span class="right_lver"></span>]:</span> <span class="right_lval"></span>
	    <span class="right_shifter"><span lang="L_SHIFTER_RIGHT"></span>[<span class="right_rver"></span>]:</span> <span class="right_rval"></span>
	</div>
    </div>
</div>

<div class="scan">
    <div class="button edsscan"><span lang="L_SCAN"></span></div>
</div>

<div class="live" style="display: none;">
    <div class="fgear">&nbsp;</div>

    <div class="cgear">
	<div class="gear"></div>
	<div class="gears"></div>
    </div>

    <div class="action_buttons">
	<div class="button front" style="display: none;"><span lang="L_FRONT"></span></div>
	<div style="width: 100%; height: 1em;"></div>
	<div class="button up"><span lang="L_UP"></span></div>
	<div class="button down"><span lang="L_DOWN"></span></div>
    </div>
</div>

<div class="settings" style="display: none;">
    <div class="action_buttons">
	<div class="button down"><span lang="L_DOWN"></span></div>
	<div class="button gear"></div>
	<div class="button gears">
	    <select>
		<option value="3">3</option>
		<option value="4">4</option>
		<option value="5">5</option>
		<option value="6">6</option>
		<option value="7">7</option>
		<option value="8">8</option>
		<option value="9">9</option>
		<option value="10">10</option>
		<option value="11">11</option>
		<option value="12">12</option>
		<option value="13">13</option>
		<option value="14">14</option>
	    </select>
	</div>
	<div class="button up"><span lang="L_UP"></span></div>
    </div>

    <div class="micro" style="display: none;">
	<div class="button up"><span lang="L_UP"></span></div>
	<div class="button down"><span lang="L_DOWN"></span></div>
    </div>

    <div class="gear_values">
	<div class="vcontent">
	    <div class="content"></div>
	    <div class="buttons">
		<div class="button set_move"><span lang="L_SET_MOVE"></span></div>
		<div class="button set_all"><span lang="L_SET_ALL"></span></div>
		<div class="button save"><span lang="L_SAVE_AS" ></span></div>
	    </div>
	</div>
	<div class="presets"></div>
    </div>

    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="vbutton top"><span lang="L_UP"></span></div>
		<div class="vbutton bottom"><span lang="L_DOWN"></span></div>
	    </div>
	</div>
    </div>
    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="button mode"><span lang="L_RACE"></span></div>
	    </div>
	</div>
    </div>
</div>

<div class="txsettings" style="display: none;">
    <div class="fvnone" style="display: none;">
        <span lang="L_NO_FD_CONNECTED"></span> <a href="javascript:location.reload();"><span lang="L_NO_FD_CONNECTED_HERE"></span></a>
    </div>

    <div class="front_buttons">
	<div class="button down"><span lang="L_DOWN"></span></div>
	<div class="button gear"></div>
	<div class="button up"><span lang="L_UP"></span></div>
    </div>

    <div class="front_micro" style="display: none;">
	<div class="button up"><span lang="L_UP"></span></div>
	<div class="button down"><span lang="L_DOWN"></span></div>
    </div>

    <div class="action_buttons">
	<div class="button down"><span lang="L_DOWN"></span></div>
	<div class="button gear"></div>
	<div class="button gears">
	    <select>
		<option value="3">3</option>
		<option value="4">4</option>
		<option value="5">5</option>
		<option value="6">6</option>
		<option value="7">7</option>
		<option value="8">8</option>
		<option value="9">9</option>
		<option value="10">10</option>
		<option value="11">11</option>
		<option value="12">12</option>
		<option value="13">13</option>
		<option value="14">14</option>
	    </select>
	</div>
	<div class="button up"><span lang="L_UP"></span></div>
    </div>

    <div class="micro" style="display: none;">
	<div class="button up"><span lang="L_UP"></span></div>
	<div class="button down"><span lang="L_DOWN"></span></div>
    </div>

    <div class="gear_values">
	<div class="fvcontent">
	    <div class="content"></div>
	    <div class="buttons">
		<div class="button set_all"><span lang="L_SET_ALL"></span></div>
	    </div>
	</div>

	<div class="vcontent">
	    <div class="content"></div>
	    <div class="buttons">
		<div class="button set_move"><span lang="L_SET_MOVE"></span></div>
		<div class="button set_all"><span lang="L_SET_ALL"></span></div>
		<div class="button save"><span lang="L_SAVE_AS"></span></div>
	    </div>
	</div>
	<div class="presets"></div>
    </div>

    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="button single">
		    <select button="single">
			<option value="front" lang="L_FRONT"></option>
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
	    </div>
	    <div class="vbox">
		<div class="vbutton small">
		    <select button="small">
			<option value="front" lang="L_FRONT"></option>
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
		<div class="vbutton big">
		    <select button="big">
			<option value="front" lang="L_FRONT"></option>
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
	    </div>
	</div>
    </div>
    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="button mode"><span lang="L_RACE"></span></div>
		<div class="button sleep"><span lang="L_SLEEP"></span></div>
		<div class="button rdprotect"><span lang="L_RD_PROTECT"></span></div>
	    </div>
	</div>
    </div>
</div>

<div class="gxsettings" style="display: none;">
    <div class="action_buttons">
	<div class="button down"><span lang="L_DOWN"></span></div>
	<div class="button gear"></div>
	<div class="button gears">
	    <select>
		<option value="3">3</option>
		<option value="4">4</option>
		<option value="5">5</option>
		<option value="6">6</option>
		<option value="7">7</option>
		<option value="8">8</option>
		<option value="9">9</option>
		<option value="10">10</option>
		<option value="11">11</option>
		<option value="12">12</option>
		<option value="13">13</option>
		<option value="14">14</option>
	    </select>
	</div>
	<div class="button up"><span lang="L_UP"></span></div>
    </div>

    <div class="micro" style="display: none;">
	<div class="button up"><span lang="L_UP"></span></div>
	<div class="button down"><span lang="L_DOWN"></span></div>
    </div>

    <div class="gear_values">
	<div class="vcontent">
	    <div class="content"></div>
	    <div class="buttons">
		<div class="button set_move"><span lang="L_SET_MOVE"></span></div>
		<div class="button set_all"><span lang="L_SET_ALL"></span></div>
		<div class="button save"><span lang="L_SAVE_AS"></span></div>
	    </div>
	</div>
	<div class="presets"></div>
    </div>

    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="button single">
		    <select button="single">
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
	    </div>
	    <div class="vbox">
		<div class="vbutton small">
		    <select button="small">
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
		<div class="vbutton big">
		    <select button="big">
			<option value="up" lang="L_UP_SHIFT"></option>
			<option value="down" lang="L_DOWN_SHIFT"></option>
		    </select>
		</div>
	    </div>
	</div>
    </div>
    <div class="buttons_function">
	<div class="content">
	    <div class="vbox">
		<div class="button mode"><span lang="L_RACE"></span></div>
		<div class="button sleep"><span lang="L_SLEEP"></span></div>
	    </div>
	</div>
    </div>
</div>

<textarea class="debug" readonly></textarea>
<div class="menus">
    <div class="bmenus" style="display: none;">
	<div class="button button_disconnect icon-disconnect" style="display: none;"></div>
	<div class="button button_shutdown icon-shutdown" style="display: none;"></div>
	<div class="button button_export icon-export" style="display: none;"></div>
	<div class="button button_import icon-import" style="display: none;"></div>
	<div class="button button_page icon-wrench" style="display: none;"></div>
	<div class="button button_lock_screen icon-lock open"></div>
	<div class="button button_zoom_out icon-zoom-out"></div>
	<div class="button button_zoom_in icon-zoom-in"></div>
	<div class="button button_debug icon-logs selected"></div>
    </div>
    <div class="button button_menu icon-gear"></div>
</div>

<div class="error" style="display: none;"></div>
<div class="qalert" style="display: none;"></div>

<div class="dim" style="display: none;"></div>

<form id="uploadform" style="display: none;">
    <input id="gearsfile" name="files[]" type="file" />
</form>

</body>
</html>
